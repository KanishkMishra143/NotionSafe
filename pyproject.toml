[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notionsafe"
version = "0.1.0"
description = "A cross-platform desktop app to backup Notion workspaces locally."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "notion-client>=1.0.0",
  "notion2md==2.9.0",
  "requests>=2.28.0",
  "GitPython>=3.1.27",
  "python-dotenv>=0.21.0",
  "keyring>=23.9.3",
  "PyYAML>=6.0",
  "SQLAlchemy>=1.4.42",
  "python-dateutil>=2.8.2",
  "tqdm>=4.64.1",
  "psutil>=5.9.2",
  "rich>=14.2.0",
  "schedule==1.2.2",
]

authors = [
  { name = "Kanishk Mishra", email = "kanishk.kumar412@example.com" },
]

classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
notionsafe = "notebackup.__main__:main"

[project.optional-dependencies]
gtk = ["PyGObject"]
windows = ["PySide6>=6.4.0"]
dev = ["pytest>=7.1.3", "black>=22.10.0", "flake8>=5.0.4"]

[project.urls]
Homepage = "https://github.com/KanishkMishra143/NotionSafe"
"Bug Tracker" = "https://github.com/KanishkMishra143/NotionSafe/issues"

[tool.setuptools.packages.find]
# discover any package under the project root named "notebackup" or nested ones
where = ["."]
include = ["notebackup*"]

[tool.flake8]
exclude = [
  "venv",
  "examples",
  "notebackup/__pycache__",
]
